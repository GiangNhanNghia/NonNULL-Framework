# Hierarchical Cultivation Configuration
cultivation:
  output_dir: "./output/euler_checkpoints"
  final_adapter_name: "adapter_B_vol4"
  optim: "adamw_torch"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  weight_decay: 0.001
  max_grad_norm: 2.0
  warmup_steps: 6
  validation_split: 10
  early_stopping_patience: 1
  fp16: true
  save_strategy: "epoch"
  logging_steps: 1
  clean_gen2_format: true
